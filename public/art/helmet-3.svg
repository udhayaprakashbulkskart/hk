<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="helmet artwork">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="70%">
      <stop offset="0" stop-color="hsl(45 70% 18%)"/>
      <stop offset=".55" stop-color="#120708"/>
      <stop offset="1" stop-color="#070707"/>
    </radialGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="hsl(45 95% 62%)"/>
      <stop offset=".5" stop-color="hsl(85 90% 45%)"/>
      <stop offset="1" stop-color="hsl(45 80% 22%)"/>
    </linearGradient>
    <linearGradient id="visor" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity=".95"/>
      <stop offset="1" stop-color="hsl(45 95% 62%)" stop-opacity=".7"/>
    </linearGradient>
    <radialGradient id="pad" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="hsl(45 100% 55%)" stop-opacity=".7"/>
      <stop offset="1" stop-color="hsl(45 100% 55%)" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
